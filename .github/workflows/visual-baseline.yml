name: Visual Baselines

# 시각 회귀 기준선(*-linux.png) 생성 전용 — 수동 트리거만.
# 픽셀 기준선은 OS·폰트 래스터에 바인딩되므로 CI와 동일한 ubuntu-latest 러너에서
# 생성해야 한다. 생성 후 아티팩트를 받아 tests/e2e/visual.spec.js-snapshots/에 커밋.
on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Generate Linux snapshots
        run: npx playwright test tests/e2e/visual.spec.js --update-snapshots

      - name: Upload snapshots
        uses: actions/upload-artifact@v4
        with:
          name: visual-snapshots-linux
          path: tests/e2e/visual.spec.js-snapshots/
          retention-days: 30
