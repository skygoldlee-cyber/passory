            <!-- @spec TR-01,TR-21~23 -->
            <section id="textbook-reader-view" class="view-section">
                <!-- Reading Progress Bar (fixed at top of view) -->
                <div id="reader-progress-bar" class="reader-progress-bar is-hidden">
                    <div id="reader-progress-fill" class="reader-progress-fill"></div>
                    <span id="reader-section-progress" class="reader-section-progress"></span>
                </div>
                <!-- Reader Layout: TOC sidebar + Content -->
                <div id="reader-layout" class="reader-layout">
                <!-- Reader Chrome (TR-21~23): 컨트롤+툴바+오디오를 하나의 absolute 오버레이
                     래퍼로 묶어 본문 컬럼 위에 띄우고 스크롤 방향으로 자동 숨김한다.
                     .reader-layout이 containing block — 데스크톱은 TOC 폭만큼 left 오프셋 -->
                <div id="reader-chrome" class="reader-chrome">
                <div class="textbook-reader-controls mb-5">
                    <div class="reader-mode-buttons">
                        <!-- 모바일 통합 바 — 툴바 토글·목차 버튼이 이 행에 함께 표시됨 (데스크톱은 CSS 숨김) -->
                        <button class="reader-toolbar-toggle" id="reader-toolbar-toggle" title="툴바 접기/펼치기" aria-label="툴바 접기/펼치기" aria-expanded="true">
                            <i class="fa-solid fa-chevron-up" aria-hidden="true"></i>
                        </button>
                        <button class="reader-tool-btn reader-toc-mobile-toggle" id="reader-toc-mobile-btn" title="목차 열기">
                            <i class="fa-solid fa-list" aria-hidden="true"></i> <span>목차</span>
                        </button>
                        <div class="filter-group">
                            <label for="reader-subject-select">과목 선택</label>
                            <select id="reader-subject-select" class="form-select reader-mode-btn">
                                <option value="">과목을 선택하세요</option>
                            </select>
                        </div>
                        <label class="reader-mode-checkbox" title="이야기형 교재 + 오디오 제공">
                            <input type="checkbox" id="reader-story-mode-toggle" >
                            <i class="fa-solid fa-book-open-reader text-primary" aria-hidden="true"></i> 이야기형 <span class="pro-badge" data-pro-feature="story_textbook">PRO</span>
                        </label>
                    </div>
                </div>

                <!-- Reading Convenience Toolbar — 펼침 도구 패널 (토글/목차는 통합 바로 이동) -->
                <div id="reader-toolbar" class="reader-toolbar is-hidden">
                    <div class="reader-toolbar-inner" id="reader-toolbar-inner">
                    <div class="reader-toolbar-group">
                        <div class="reader-search-box">
                            <input type="text" id="reader-in-content-search" placeholder="본문 검색..." aria-label="본문 내 검색">
                            <span id="reader-search-count" class="reader-search-count"></span>
                            <button class="reader-tool-btn reader-search-nav-btn" id="reader-search-prev" title="이전 검색 결과" aria-label="이전 검색 결과"><i class="fa-solid fa-chevron-up" aria-hidden="true"></i></button>
                            <button class="reader-tool-btn reader-search-nav-btn" id="reader-search-next" title="다음 검색 결과" aria-label="다음 검색 결과"><i class="fa-solid fa-chevron-down" aria-hidden="true"></i></button>
                            <button class="reader-tool-btn reader-search-nav-btn" id="reader-search-clear" title="검색 닫기" aria-label="검색 닫기"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
                        </div>
                    </div>
                    <div class="reader-toolbar-divider"></div>
                    <div class="reader-toolbar-group" id="reader-chapter-actions-group">
                        <!-- 챕터 액션: 동적 생성 (오디오 — 기출 필터/원본/참조자료 버튼은 제거됨, SPEC SA-01·RR-07) -->
                    </div>
                    </div><!-- /.reader-toolbar-inner -->
                </div>

                <!-- 오디오 플레이어 영역 (크롬 안에 둬서 자동 숨김에 함께 반응, 동적 생성) -->
                <div id="reader-audio-player-area" class="reader-audio-player-area is-hidden"></div>
                </div><!-- /#reader-chrome -->

                    <!-- TOC Sidebar (sections of current chapter) -->
                    <aside id="reader-toc" class="reader-toc is-hidden">
                        <div class="reader-toc-header">
                            <i class="fa-solid fa-list" aria-hidden="true"></i> 목차
                        </div>
                        <nav id="reader-toc-list" class="reader-toc-list">
                            <!-- Populated dynamically -->
                        </nav>
                    </aside>
                    <div id="reader-toc-backdrop" class="reader-toc-backdrop is-hidden"></div>
                    <!-- 왼쪽 가장자리 스와이프 힌트 탭 — TOC 로드 시에만 표시 (모바일) -->
                    <button id="reader-toc-edge-hint" class="reader-toc-edge-hint" type="button"
                            aria-label="목차 열기" title="왼쪽 끝을 오른쪽으로 밀면 목차"></button>
                    <!-- Sticky current section heading — .reader-layout 기준 absolute 오버레이
                         (인플로우 배치 시 표시/숨김마다 flex 높이 리플로우로 본문 영역이 흔들림) -->
                    <div id="reader-sticky-heading" class="reader-sticky-heading is-hidden">
                        <i class="fa-solid fa-bookmark text-primary" aria-hidden="true"></i>
                        <span id="reader-sticky-heading-text"></span>
                    </div>

                    <div id="textbook-reader-container" class="textbook-reader-content">
                        <div class="empty-state" role="status">
                            <i class="fa-solid fa-book-open empty-state-icon" aria-hidden="true"></i>
                            <h3>읽을 교재를 선택하세요</h3>
                            <p>위에서 과목을 선택하면 해당 교재의 본문 내용이 표시됩니다.</p>
                        </div>
                    </div>
                </div>

                <!-- Back to top button -->
                <button id="reader-back-to-top" class="reader-back-to-top is-hidden" title="맨 위로" aria-label="맨 위로">
                    <i class="fa-solid fa-arrow-up" aria-hidden="true"></i>
                </button>

                <!-- Table fullscreen modal -->
                <div id="reader-table-modal" class="reader-table-modal is-hidden">
                    <div class="reader-table-modal-backdrop"></div>
                    <div class="reader-table-modal-content dialog-card">
                        <button class="reader-table-modal-close" id="reader-table-modal-close" aria-label="표 모달 닫기"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
                        <div id="reader-table-modal-body" class="reader-table-modal-body"></div>
                    </div>
                </div>
            </section>
