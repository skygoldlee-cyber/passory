            <!-- @spec DI-01,DI-04,DI-05 -->
            <section id="dictionary-view" class="view-section">
                <div class="section-title-area">
                    <h3><i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i> <span id="dict-title">항목 검색 사전</span></h3>
                    <p><span id="dict-subtitle">등록된 항목을 실시간 검색해 확인하세요.</span> <button type="button" id="dict-db-version" class="dict-db-version" data-click="showIngredientsChangelog" title="DB 버전 이력 보기"></button></p>
                    <p class="dict-neglist-note is-hidden" id="dict-note"></p>
                </div>

                <div class="dictionary-control-panel mb-6">
                    <!-- Search Bar -->
                    <div class="dict-search-row flex-center gap-4 mb-5">
                        <div class="search-input-wrapper relative flex-1">
                            <i class="fa-solid fa-magnifying-glass search-input-icon" aria-hidden="true"></i>
                            <input type="text" id="dict-search-input" class="form-input search-input" placeholder="항목명 또는 초성을 입력하여 실시간 검색" aria-label="사전 검색어 입력">
                        </div>
                        <button class="btn btn-secondary flex-center gap-2" data-click="clearDictSearch"><i class="fa-solid fa-xmark" aria-hidden="true"></i> 초기화</button>
                        <button class="btn btn-secondary flex-center gap-2" data-click="dictExportCsv" title="현재 검색·필터 결과를 CSV로 저장"><i class="fa-solid fa-file-csv" aria-hidden="true"></i> 필터 CSV</button>
                        <button class="btn btn-secondary flex-center gap-2" data-click="dictExportCsv" data-arg="all" title="검색·필터 무관하게 사전 DB 전체를 CSV로 저장"><i class="fa-solid fa-database" aria-hidden="true"></i> 전체 CSV</button>
                    </div>

                    <!-- Category Filter Buttons — knowledge 스키마(manifest.knowledge.filters)에서 JS가 렌더 -->
                    <div class="dict-filter-buttons flex-row gap-3 flex-wrap">
                    </div>
                </div>

                <!-- Dictionary Results Container -->
                <div class="dictionary-grid" id="dict-results-container">
                    <!-- Populated dynamically via JS -->
                </div>
            </section>
